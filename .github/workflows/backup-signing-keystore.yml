name: Backup signing keystore

# Produces a downloadable copy of the CI signing keystore currently held in the
# Actions cache. This is the SAFETY NET for the signing identity:
#
#   * The keystore normally lives only in the Actions cache
#     (dictate-ci-signing-keystore-v1) and is kept alive by the daily
#     "Sync upstream" workflow.
#   * If the cache is ever lost (GitHub purge, manual deletion) the "Build APK"
#     workflow FAILS loudly instead of rotating the key.
#   * Download the artifact from this workflow, then restore the keystore into
#     the repository secrets so it survives even a full cache loss:
#
#         base64 -w0 ci-release.jks > keystore.b64
#
#     and set these repo secrets:
#         KEYSTORE_BASE64      = the whole base64 blob above
#         KEYSTORE_PASSWORD    = dictate-ci-2026   (unless changed)
#         KEY_ALIAS            = dictate
#         KEY_PASSWORD         = dictate-ci-2026   (unless changed)
#
#   * Artifacts expire after the retention period; keep a copy somewhere safe
#     (password manager, encrypted drive). Anyone with the keystore + password
#     can sign updates for this app.
#
# Runs weekly on a schedule and on manual trigger.

on:
  schedule:
    # Weekly on Sunday 04:00 UTC as a routine safety backup.
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore CI signing keystore from cache
        uses: actions/cache@v4
        with:
          path: ~/.ci-signing
          key: dictate-ci-signing-keystore-v1

      - name: Package keystore for download
        id: package
        shell: bash
        run: |
          KEYSTORE="$HOME/.ci-signing/ci-release.jks"
          if [ ! -f "$KEYSTORE" ]; then
            if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
              mkdir -p "$HOME/.ci-signing"
              echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE"
              echo "Keystore not in cache; recreated it from the KEYSTORE_BASE64 secret."
            else
              echo "::warning::No CI signing keystore found in the Actions cache and no KEYSTORE_BASE64 secret is set."
              echo "Nothing to back up yet. Run 'Build APK' once so the cache is populated, or set the KEYSTORE_BASE64 secret."
              echo "available=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          mkdir -p "$GITHUB_WORKSPACE/.backup"
          cp "$KEYSTORE" "$GITHUB_WORKSPACE/.backup/ci-release.jks"
          echo "Keystore prepared for upload."
          echo "available=true" >> "$GITHUB_OUTPUT"
          ls -la "$GITHUB_WORKSPACE/.backup/"

      - name: Upload keystore backup artifact
        if: steps.package.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ci-signing-keystore-backup
          path: .backup/ci-release.jks
          if-no-files-found: error
          retention-days: 7

      - name: Backup summary
        shell: bash
        run: |
          if [ "${{ steps.package.outputs.available }}" = "true" ]; then
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Signing keystore backup created

          Download the `ci-signing-keystore-backup` artifact and store it safely.
          To make the key survive a full cache loss, set it as a repo secret:

          ```bash
          base64 -w0 ci-release.jks > keystore.b64
          ```

          Set `KEYSTORE_BASE64` to the contents of `keystore.b64`, plus
          `KEYSTORE_PASSWORD=dictate-ci-2026`, `KEY_ALIAS=dictate`,
          `KEY_PASSWORD=dictate-ci-2026` (unless you changed them).
          EOF
          else
          echo "Nothing to back up - see logs."
          fi
