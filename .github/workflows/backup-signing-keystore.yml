name: Backup signing keystore

# Safety net and watchdog for the CI signing identity.
#
#   * The keystore normally lives only in the Actions cache
#     (dictate-ci-signing-keystore-v1) and is kept alive by the daily
#     "Sync upstream" workflow.
#   * If the cache is ever lost (GitHub purge, manual deletion) the "Build APK"
#     workflow FAILS loudly instead of rotating the key.
#   * This workflow acts as an INDEPENDENT WATCHDOG: on every run it reads the
#     keystore and verifies its certificate still matches the pinned
#     EXPECTED_CERT_SHA256. A mismatch fails the run loudly, so a silent key
#     drift cannot go unnoticed even if no APK is built for a while.
#   * It can also produce an OFF-SITE backup, but the keystore is a private key
#     and this repository is public, so the backup is only ever uploaded
#     ENCRYPTED. To enable it, set a repository secret BACKUP_PASSPHRASE (a
#     strong, unique passphrase) and optionally KEYSTORE_PASSWORD / KEY_ALIAS /
#     KEY_PASSWORD. Every run without that secret still verifies the identity
#     but uploads nothing (there is deliberately no plaintext export path).
#   * To restore after a cache loss, decrypt the artifact and set the repo
#     secrets so every run heals itself with the SAME key:
#         KEYSTORE_BASE64   = base64 -w0 ci-release.jks
#         KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
#     Keep the backup passphrase and the decrypted keystore in a password
#     manager. Anyone with the keystore + password can sign updates for this app.
#
# Runs weekly on a schedule and on manual trigger.

on:
  schedule:
    # Weekly on Sunday 04:00 UTC as a routine safety check.
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      # SHA-256 of the pinned CI signing certificate. Must never change unless
      # the key is deliberately rotated (in which case update it in every
      # workflow and re-issue a build with allow_key_change=true once).
      EXPECTED_CERT_SHA256: '38eb6683c0f9fde03882c176a372d5a86dee860183c785cec4b7a517f3db1520'
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore CI signing keystore from cache
        uses: actions/cache@v4
        with:
          path: ~/.ci-signing
          key: dictate-ci-signing-keystore-v1

      - name: Verify signing identity (watchdog)
        id: verify
        shell: bash
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          KS_PASS="${KS_PASS:-dictate-ci-2026}"
          KS_ALIAS="${KS_ALIAS:-dictate}"
          KEYSTORE="$HOME/.ci-signing/ci-release.jks"

          if [ ! -f "$KEYSTORE" ]; then
            if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
              mkdir -p "$HOME/.ci-signing"
              echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE"
              echo "Keystore not in cache; recreated it from the KEYSTORE_BASE64 secret."
            else
              echo "::warning::No CI signing keystore found in the Actions cache and no KEYSTORE_BASE64 secret is set."
              echo "Nothing to verify yet. Run 'Build APK' once so the cache is populated, or set the KEYSTORE_BASE64 secret."
              echo "available=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          KS_SHA=$(keytool -list -v -keystore "$KEYSTORE" -storepass "$KS_PASS" -alias "$KS_ALIAS" 2>/dev/null \
            | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ' :' | tr 'A-F' 'a-f')
          if [ -z "$KS_SHA" ]; then
            echo "::error::Could not read the signing certificate from the CI keystore (wrong password/alias?)."
            exit 1
          fi

          echo "CI keystore certificate SHA-256: $KS_SHA"
          if [ "$KS_SHA" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Signing identity drift detected: keystore is ${KS_SHA}, pinned expectation is ${EXPECTED_CERT_SHA256}."
            echo "Restore the intended keystore (cache or KEYSTORE_BASE64 secret). Do not accept a changed key silently."
            exit 1
          fi
          echo "Signing identity matches the pinned certificate."

          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "cert_sha256=$KS_SHA" >> "$GITHUB_OUTPUT"

      - name: Encrypt keystore for off-site backup
        id: encrypt
        if: steps.verify.outputs.available == 'true'
        shell: bash
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          KEYSTORE="$HOME/.ci-signing/ci-release.jks"
          if [ -z "${BACKUP_PASSPHRASE:-}" ]; then
            echo "::warning::No BACKUP_PASSPHRASE secret is set; skipping the off-site backup."
            echo "The keystore is a private key and this repository is public, so it is never uploaded unencrypted."
            echo "Set the BACKUP_PASSPHRASE secret to enable encrypted backups."
            echo "encrypted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          OUT="$GITHUB_WORKSPACE/.backup/ci-release.jks.enc"
          mkdir -p "$GITHUB_WORKSPACE/.backup"
          # AES-256 with a salted, high-iteration KDF. Passphrase passed via the
          # environment so it never appears in the process arguments.
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in "$KEYSTORE" -out "$OUT" -pass env:BACKUP_PASSPHRASE
          echo "Encrypted keystore backup written."
          echo "encrypted=true" >> "$GITHUB_OUTPUT"

      - name: Upload encrypted keystore backup
        if: steps.encrypt.outputs.encrypted == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ci-signing-keystore-backup-encrypted
          path: .backup/ci-release.jks.enc
          if-no-files-found: error
          retention-days: 30

      - name: Backup summary
        shell: bash
        run: |
          {
            echo "## Signing keystore status"
            echo
            echo "- Certificate SHA-256: \`${{ steps.verify.outputs.cert_sha256 || 'n/a' }}\`"
            echo "- Off-site encrypted backup: \`${{ steps.encrypt.outputs.encrypted || 'false' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.encrypt.outputs.encrypted }}" = "true" ]; then
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'

          Download the `ci-signing-keystore-backup-encrypted` artifact and store it with the passphrase.
          To make the key survive a full cache loss, also set the repo secret:

          ```bash
          base64 -w0 ci-release.jks > keystore.b64
          ```

          Set `KEYSTORE_BASE64` to the contents of `keystore.b64`, plus
          `KEYSTORE_PASSWORD=dictate-ci-2026`, `KEY_ALIAS=dictate`,
          `KEY_PASSWORD=dictate-ci-2026` (unless you changed them).
          EOF
          fi
