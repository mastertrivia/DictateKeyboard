name: Sync upstream

# Keeps this fork in step with the upstream repository (DevEmperor/DictateKeyboard):
# on a schedule (and on manual trigger) it fetches upstream/main and merges it into
# this fork's main, then pushes. Because a push made with GITHUB_TOKEN does not
# itself fire the "Build APK" workflow, the build is dispatched explicitly
# afterwards (this needs the actions: write permission above) - so every upstream
# update produces a fresh APK automatically.
#
# The workflow also touches the shared CI signing-keystore cache every day. GitHub
# evicts cache entries not accessed for 7 days, and the signing key MUST stay the
# same forever (Android refuses to install an update signed with a different key).
# The daily restore keeps the key alive indefinitely and recreates it on a miss.
#
# If upstream ever edits the exact same lines this fork changed (gradle.properties
# heap settings, the :app lint disable, ...), the merge stops with a conflict and
# this run fails loudly - resolve it locally and push, or open the repo in the
# browser and use "Sync fork".

on:
  schedule:
    # Runs daily at 03:17 UTC to pick up whatever the developer published the day before.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Repository to sync from (owner/name)'
        required: false
        default: 'DevEmperor/DictateKeyboard'
        type: string
      upstream_branch:
        description: 'Branch to sync from'
        required: false
        default: 'main'
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Restore the shared CI signing keystore so this (nearly daily) run counts as
      # an access and GitHub never evicts it. Populates it on a cold cache too.
      - name: Restore CI signing keystore
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: ~/.ci-signing
          key: dictate-ci-signing-keystore-v1

      - name: Ensure CI signing keystore exists
        shell: bash
        run: |
          KEYSTORE="$HOME/.ci-signing/ci-release.jks"
          if [ ! -f "$KEYSTORE" ]; then
            mkdir -p "$HOME/.ci-signing"
            keytool -genkey -v -keystore "$KEYSTORE" -alias "dictate" \
              -keyalg RSA -keysize 4096 -validity 10000 -storetype JKS \
              -storepass "dictate-ci-2026" -keypass "dictate-ci-2026" \
              -dname "CN=Dictate Keyboard CI,O=Dictate CI,C=US"
            echo "Generated fresh CI signing keystore."
          else
            echo "Using cached CI signing keystore."
          fi

      - name: Configure git
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream/main and push
        id: merge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPO: ${{ github.event.inputs.upstream_repo || 'DevEmperor/DictateKeyboard' }}
          UPSTREAM_BRANCH: ${{ github.event.inputs.upstream_branch || 'main' }}
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream "${UPSTREAM_BRANCH}"

          BEHIND=$(git rev-list --count "HEAD..upstream/${UPSTREAM_BRANCH}")
          echo "Commits behind upstream (${UPSTREAM_REPO}:${UPSTREAM_BRANCH}): $BEHIND"

          if [ "$BEHIND" -eq 0 ]; then
            echo "Already up to date with upstream."
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Merging upstream/${UPSTREAM_BRANCH} into main ..."
          if ! git merge "upstream/${UPSTREAM_BRANCH}" --no-edit; then
            echo "::error::Merge conflict while syncing upstream. This fork's local edits collide with upstream changes. Resolve the conflict and push manually."
            exit 1
          fi

          echo "Pushing synced main to origin ..."
          git push origin main
          echo "Sync complete."
          echo "merged=true" >> "$GITHUB_OUTPUT"

      # A push made with GITHUB_TOKEN does not itself fire the Build APK workflow,
      # so dispatch it explicitly to produce an APK of the freshly synced source.
      - name: Trigger APK build
        if: steps.merge.outputs.merged == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run "Build APK" --repo "$GITHUB_REPOSITORY" --ref main -f build_type=release
          echo "Dispatched Build APK on the synced main."
