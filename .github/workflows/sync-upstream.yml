name: Sync upstream (retired)

# Retired: merge + APK build now live in .github/workflows/build-apk.yml
# ("Sync and Build", workflow_dispatch only). This file is kept for history.
# No schedule and no dispatch, so it does not appear as a runnable Action.

on:
  push:
    branches:
      - __retired-do-not-use-sync-upstream__

jobs:
  retired:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Retired
        run: echo "Use the Sync and Build workflow instead."
