name: Sync upstream

# Keeps this fork in step with the upstream repository (DevEmperor/DictateKeyboard):
# on a schedule (and on manual trigger) it fetches upstream/main and merges it into
# this fork's main, then pushes.
#
# IMPORTANT - this workflow NEVER builds an APK. Syncing ordinary upstream
# commits must not produce releases; the "Build APK" workflow is independent and
# runs only for official upstream RELEASE TAGS (v6.1.2, v6.1.3, ...), checking
# out the exact tagged commit. See .github/workflows/build-apk.yml.
#
# The workflow also touches the shared CI signing-keystore cache every day. GitHub
# evicts cache entries not accessed for 7 days, and the signing key MUST stay the
# same forever (Android refuses to install an update signed with a different key).
# The daily restore keeps the key alive indefinitely. It never regenerates the
# key: if the keystore is genuinely lost (cache purge), the "Build APK" workflow
# fails loudly so the key can be restored from the KEYSTORE_BASE64 secret instead
# of silently rotating. If that secret is set, this workflow also re-materialises
# the keystore from it so a cold cache heals itself with the SAME key.
#
# If upstream ever edits the exact same lines this fork changed (gradle.properties
# heap settings, the :app lint disable, ...), the merge stops with a conflict and
# this run fails loudly - resolve it locally and push, or open the repo in the
# browser and use "Sync fork".

on:
  schedule:
    # Runs daily at 03:17 UTC to pick up whatever the developer published the day before.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Repository to sync from (owner/name)'
        required: false
        default: 'DevEmperor/DictateKeyboard'
        type: string
      upstream_branch:
        description: 'Branch to sync from'
        required: false
        default: 'main'
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Restore the shared CI signing keystore so this (nearly daily) run counts as
      # an access and GitHub never evicts it. Populates it on a cold cache too.
      - name: Restore CI signing keystore
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: ~/.ci-signing
          key: dictate-ci-signing-keystore-v1

      # Warm/restore the keystore WITHOUT ever generating a new key. If the cache
      # is missing and a KEYSTORE_BASE64 secret exists, recreate the keystore from
      # the secret (same key, no rotation). If neither exists, warn loudly - the
      # next "Build APK" run will fail until the keystore is restored, which is the
      # intended protection against silently rotating the signing identity.
      - name: Warm CI signing keystore
        shell: bash
        run: |
          KEYSTORE="$HOME/.ci-signing/ci-release.jks"
          if [ -f "$KEYSTORE" ]; then
            echo "Using cached CI signing keystore."
          elif [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            mkdir -p "$HOME/.ci-signing"
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE"
            echo "Recreated CI signing keystore from the KEYSTORE_BASE64 secret (same key)."
          else
            echo "::warning::CI signing keystore not present in the Actions cache and no KEYSTORE_BASE64 secret is set."
            echo "This does not block syncing upstream, but the next 'Build APK' run will fail until the keystore is restored (cache restore or secret). No new key is generated automatically, to avoid rotating the signing identity."
          fi

      - name: Configure git
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream/main and push
        id: merge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REPO: ${{ github.event.inputs.upstream_repo || 'DevEmperor/DictateKeyboard' }}
          UPSTREAM_BRANCH: ${{ github.event.inputs.upstream_branch || 'main' }}
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream "${UPSTREAM_BRANCH}"

          BEHIND=$(git rev-list --count "HEAD..upstream/${UPSTREAM_BRANCH}")
          echo "Commits behind upstream (${UPSTREAM_REPO}:${UPSTREAM_BRANCH}): $BEHIND"

          if [ "$BEHIND" -eq 0 ]; then
            echo "Already up to date with upstream."
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Merging upstream/${UPSTREAM_BRANCH} into main ..."
          if ! git merge "upstream/${UPSTREAM_BRANCH}" --no-edit; then
            echo "::error::Merge conflict while syncing upstream. This fork's local edits collide with upstream changes. Resolve the conflict and push manually."
            exit 1
          fi

          echo "Pushing synced main to origin ..."
          git push origin main
          echo "Sync complete."
          echo "merged=true" >> "$GITHUB_OUTPUT"

      # No APK build is triggered here. Sync and release builds are independent:
      # the "Build APK" workflow reacts only to upstream release tags.
