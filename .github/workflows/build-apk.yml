name: Sync and Build

# One click: merge DevEmperor/DictateKeyboard into this fork's main, then build
# a signed arm64-v8a-only APK. Manual only — no schedule.
#
#   1. Merge upstream/<branch> into origin/main. The fork's permanent
#      exclusion (arm64-v8a only) and ZIP voice overlay live on main; a
#      conflict fails the run instead of shipping extra ABIs.
#   2. Re-apply the small CI-only patches in .github/ci-patches/ onto the
#      working tree (not committed) so Gradle fits GitHub ubuntu-latest RAM.
#   3. Build, verify the APK contains only arm64-v8a native libs, and sign
#      with the pinned CI keystore (dictate-ci-signing-keystore-v1).
#
# Signing identity never rotates here. Cache miss + no KEYSTORE_BASE64 secret
# fails the job. Bypass only with allow_new_key_if_missing / allow_key_change.

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Repository to sync from (owner/name)'
        required: false
        default: 'DevEmperor/DictateKeyboard'
        type: string
      upstream_branch:
        description: 'Branch to sync from'
        required: false
        default: 'main'
        type: string
      build_type:
        description: 'APK variant to build (release, debug or beta)'
        type: choice
        required: true
        default: 'release'
        options:
          - 'release'
          - 'debug'
          - 'beta'
      create_fork_release:
        description: 'Also publish a fork GitHub Release with the APK. Off by default: builds only upload an artifact.'
        type: boolean
        required: false
        default: false
      allow_new_key_if_missing:
        description: 'Bootstrap only: generate a fresh signing keystore if none exists (this ROTATES the signing key - only use deliberately)'
        type: boolean
        required: false
        default: false
      allow_key_change:
        description: 'DANGER: allow the signing identity to differ from the pinned expected certificate (deliberate key rotation only)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-and-build
  cancel-in-progress: false

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    env:
      BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}
      UPSTREAM_REPO: ${{ github.event.inputs.upstream_repo || 'DevEmperor/DictateKeyboard' }}
      UPSTREAM_BRANCH: ${{ github.event.inputs.upstream_branch || 'main' }}
      EXPECTED_CERT_SHA256: '38eb6683c0f9fde03882c176a372d5a86dee860183c785cec4b7a517f3db1520'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore CI signing keystore
        uses: actions/cache@v4
        with:
          path: ~/.ci-signing
          key: dictate-ci-signing-keystore-v1

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/tools.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Merge upstream into main
        id: sync
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null \
            || git remote set-url upstream "https://github.com/${UPSTREAM_REPO}.git"

          git fetch -q origin main
          git fetch -q upstream "${UPSTREAM_BRANCH}"
          git checkout -q -B main origin/main

          BEHIND=$(git rev-list --count "HEAD..upstream/${UPSTREAM_BRANCH}")
          echo "Commits behind upstream (${UPSTREAM_REPO}:${UPSTREAM_BRANCH}): $BEHIND"

          if [ "$BEHIND" -eq 0 ]; then
            echo "Already up to date with upstream."
            echo "merged=false" >> "$GITHUB_OUTPUT"
          else
            echo "Merging upstream/${UPSTREAM_BRANCH} into main ..."
            if ! git merge --no-edit "upstream/${UPSTREAM_BRANCH}"; then
              echo "::error::Merge conflict syncing upstream ${UPSTREAM_REPO}:${UPSTREAM_BRANCH} into main."
              echo "Upstream changed code the fork's arm64-v8a-only exclusion or ZIP overlay owns."
              echo "Resolve the conflict, push main, then re-run this workflow."
              exit 1
            fi
            git push origin main
            echo "merged=true" >> "$GITHUB_OUTPUT"
            echo "Synced upstream/${UPSTREAM_BRANCH} into main."
          fi

          RELEASE_COMMIT=$(git rev-parse HEAD)
          echo "release_commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "Working tree at main (${RELEASE_COMMIT})."

      - name: Apply fork-only CI patches
        shell: bash
        run: |
          set -euo pipefail
          if ! ls .github/ci-patches/*.patch >/dev/null 2>&1; then
            echo "No fork-only CI patches found; building main as-is."
            exit 0
          fi
          for p in .github/ci-patches/*.patch; do
            base=$(basename "$p")
            if [ "$base" = "01-gradle-properties-heaps.patch" ] \
               && grep -q '^kotlin.daemon.jvmargs=-Xmx' gradle.properties; then
              echo "Skipping $base: tree already uses CI-safe daemon heaps."
              continue
            fi
            if [ "$base" = "02-app-build-lint.patch" ] \
               && grep -q 'InvalidFragmentVersionForActivityResult' app/lint.xml; then
              echo "Skipping $base: tree already handles the lint check in app/lint.xml."
              continue
            fi
            if ! git apply --3way --whitespace=nowarn "$p"; then
              echo "::error::Fork-only CI patch $p no longer applies cleanly to main."
              echo "Refresh .github/ci-patches/ against current main."
              exit 1
            fi
            echo "Applied $base (working tree only, not committed)."
          done

      - name: Read version
        shell: bash
        run: |
          set -euo pipefail
          VN=$(sed -n 's/^projectVersionName=//p' gradle.properties)
          VC=$(sed -n 's/^projectVersionCode=//p' gradle.properties)
          echo "VERSION_NAME=$VN" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VC" >> "$GITHUB_ENV"
          echo "Declaring versionName=${VN} versionCode=${VC}"
          if ! printf '%s' "$VC" | grep -qE '^[0-9]+$'; then
            echo "::error::Could not read a numeric projectVersionCode from gradle.properties (got '${VC}')."
            exit 1
          fi

      - name: Enforce fork exclusions
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'abiFilters += listOf("arm64-v8a")' app/build.gradle.kts; then
            echo "::error::app/build.gradle.kts no longer restricts the build to arm64-v8a."
            exit 1
          fi
          echo "Fork exclusion intact: arm64-v8a only."

      - name: Set up Android SDK components
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found in \$ANDROID_HOME or on PATH"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;4.1.2"
          "$SDKMANAGER" --list_installed

      - name: Fetch sherpa-onnx native libraries
        shell: bash
        run: bash tools/fetch-sherpa-onnx.sh

      - name: Build Bergamot native library
        shell: bash
        run: bash tools/bergamot/build-android.sh arm64-v8a

      - name: Configure release signing
        shell: bash
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          ALLOW_NEW_KEY: ${{ github.event.inputs.allow_new_key_if_missing }}
          ALLOW_KEY_CHANGE: ${{ github.event.inputs.allow_key_change }}
        run: |
          set -euo pipefail
          KS_PASS="${KS_PASS:-dictate-ci-2026}"
          KS_ALIAS="${KS_ALIAS:-dictate}"
          KS_KEY_PASS="${KS_KEY_PASS:-$KS_PASS}"
          KEYSTORE_DIR="$HOME/.ci-signing"
          KEYSTORE="$KEYSTORE_DIR/ci-release.jks"
          mkdir -p "$KEYSTORE_DIR"

          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE"
            echo "Restored signing keystore from the KEYSTORE_BASE64 secret."
          elif [ -f "$KEYSTORE" ]; then
            echo "Using the cached CI signing keystore."
          elif [ "$ALLOW_NEW_KEY" = "true" ]; then
            echo "::warning::No signing keystore found - generating a NEW one. This ROTATES the signing key and existing installs will not accept updates signed with it."
            keytool -genkey -v -keystore "$KEYSTORE" -alias "$KS_ALIAS" \
              -keyalg RSA -keysize 4096 -validity 10000 -storetype JKS \
              -storepass "$KS_PASS" -keypass "$KS_KEY_PASS" \
              -dname "CN=Dictate Keyboard CI,O=Dictate CI,C=US"
          else
            echo "::error::No CI signing keystore is available (cache miss, no KEYSTORE_BASE64 secret)."
            echo "To keep the stable signing identity, set the KEYSTORE_BASE64 (and KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD) secrets, or run the 'Backup signing keystore' workflow, then re-run this build."
            echo "Do NOT set allow_new_key_if_missing=true unless you intentionally want to rotate the signing key."
            exit 1
          fi

          cat > keystore.properties <<EOF
          storeFile=$KEYSTORE
          storePassword=$KS_PASS
          keyAlias=$KS_ALIAS
          keyPassword=$KS_KEY_PASS
          EOF
          echo "Wrote keystore.properties for release signing."

          if [ "$BUILD_TYPE" != "debug" ] && [ "$ALLOW_KEY_CHANGE" != "true" ]; then
            KS_SHA=$(keytool -list -v -keystore "$KEYSTORE" -storepass "$KS_PASS" -alias "$KS_ALIAS" 2>/dev/null \
              | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ' :' | tr 'A-F' 'a-f')
            if [ -z "$KS_SHA" ]; then
              echo "::error::Could not read the signing certificate from the CI keystore."
              exit 1
            fi
            if [ "$KS_SHA" != "$EXPECTED_CERT_SHA256" ]; then
              echo "::error::Refusing to build: CI keystore certificate ${KS_SHA} does not match the pinned expected certificate ${EXPECTED_CERT_SHA256}."
              echo "This protects update continuity (Android rejects an update signed with a different key)."
              echo "Restore the intended keystore, or set allow_key_change=true only for a deliberate key rotation."
              exit 1
            fi
            echo "Signing identity verified against pinned certificate ($KS_SHA)."
          fi

      - name: Build APK
        shell: bash
        run: |
          case "$BUILD_TYPE" in
            debug) TASK="assembleDebug" ;;
            beta)  TASK="assembleBeta" ;;
            *)     TASK="assembleRelease" ;;
          esac
          ./gradlew "$TASK" --stacktrace --no-daemon

      - name: Verify APK
        id: verify
        shell: bash
        env:
          ALLOW_KEY_CHANGE: ${{ github.event.inputs.allow_key_change }}
        run: |
          set -euo pipefail
          APK_DIR="app/build/outputs/apk/$BUILD_TYPE"
          ls -la "$APK_DIR"
          APK="$(ls "$APK_DIR"/*.apk | head -1)"
          if [ -z "$APK" ] || [ ! -s "$APK" ]; then
            echo "::error::No APK produced in $APK_DIR"
            exit 1
          fi
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "APK_SIZE=$(stat -c %s "$APK")" >> "$GITHUB_ENV"
          echo "APK_VERSION=$(jq -r '.elements[0].versionName' "$APK_DIR/output-metadata.json")" >> "$GITHUB_ENV"

          LIBS=$(unzip -Z1 "$APK" | grep '^lib/' || true)
          BAD_ABIS=$(printf '%s\n' "$LIBS" | cut -d/ -f2 | sort -u | grep -v '^arm64-v8a$' || true)
          if [ -n "$BAD_ABIS" ]; then
            echo "::error::APK contains non-arm64-v8a native libraries: $(printf '%s' "$BAD_ABIS" | tr '\n' ' ')"
            exit 1
          fi
          echo "Artifact exclusion verified: only arm64-v8a native libs."

          if [ "$BUILD_TYPE" != "debug" ]; then
            APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
            [ -n "$APKSIGNER" ] || { echo "::error::apksigner not found"; exit 1; }
            echo "apksigner: $APKSIGNER"
            "$APKSIGNER" verify --print-certs "$APK"

            APK_SHA=$("$APKSIGNER" verify --print-certs "$APK" \
              | sed -n 's/^.*[Cc]ertificate SHA-256 digest: \([0-9A-Fa-f:]*\).*$/\1/p' \
              | head -1 \
              | tr -d ' :' | tr 'A-F' 'a-f')
            [ -n "$APK_SHA" ] || { echo "::error::Could not read APK signer certificate"; exit 1; }

            KS_PASS=$(sed -n 's/^storePassword=//p' keystore.properties)
            KS_ALIAS=$(sed -n 's/^keyAlias=//p' keystore.properties)
            KEYSTORE=$(sed -n 's/^storeFile=//p' keystore.properties)
            KS_SHA=$(keytool -list -v -keystore "$KEYSTORE" -storepass "$KS_PASS" -alias "$KS_ALIAS" 2>/dev/null \
              | sed -n 's/^[[:space:]]*SHA256: //p' \
              | tr -d ' :' | tr 'A-F' 'a-f')

            echo "APK signer   SHA-256: $APK_SHA"
            echo "Keystore     SHA-256: $KS_SHA"

            if [ "$APK_SHA" != "$KS_SHA" ]; then
              echo "::error::APK was not signed by the configured CI keystore (${APK_SHA} != ${KS_SHA})."
              exit 1
            fi

            if [ "$ALLOW_KEY_CHANGE" != "true" ] && [ "$KS_SHA" != "$EXPECTED_CERT_SHA256" ]; then
              echo "::error::Signing keystore does not match the pinned certificate (${KS_SHA} != expected ${EXPECTED_CERT_SHA256})."
              echo "Refusing to publish an APK that would break updates over existing installs. Restore the intended keystore (never silently accept a new key), or pass allow_key_change=true for a deliberate rotation."
              exit 1
            fi
            echo "Signature verified: APK is signed by the stable CI keystore."
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dictate-keyboard-${{ env.APK_VERSION }}-${{ env.BUILD_TYPE }}
          path: app/build/outputs/apk/${{ env.BUILD_TYPE }}/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create fork GitHub Release
        if: github.event.inputs.create_fork_release == 'true' && env.BUILD_TYPE == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.sync.outputs.release_commit }}
        run: |
          set -euo pipefail
          SHORT="${RELEASE_COMMIT:0:7}"
          RELEASE_NAME="dictate-v${APK_VERSION}-ci"
          TITLE="Dictate Keyboard v${APK_VERSION} (CI build from main @ ${SHORT})"
          NOTES="Built from fork main after syncing \`${UPSTREAM_REPO}:${UPSTREAM_BRANCH}\` (commit \`${RELEASE_COMMIT:-${GITHUB_SHA}}\`). Artifact: \`${APK}\`, size: ${APK_SIZE} bytes, versionCode: ${VERSION_CODE}. arm64-v8a only."
          if gh release view "$RELEASE_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::warning::Fork release ${RELEASE_NAME} already exists; skipping creation."
            exit 0
          fi
          gh release create "$RELEASE_NAME" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "${RELEASE_COMMIT:-${GITHUB_SHA}}" \
            --title "$TITLE" \
            --notes "$NOTES"
          echo "Created fork release ${RELEASE_NAME}."

      - name: Build summary
        if: always()
        shell: bash
        env:
          RELEASE_COMMIT: ${{ steps.sync.outputs.release_commit }}
          MERGED: ${{ steps.sync.outputs.merged }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Sync and Build

          | Item | Value |
          |---|---|
          | Upstream | \`${UPSTREAM_REPO}:${UPSTREAM_BRANCH}\` |
          | Merged | ${MERGED:-unknown} |
          | Source commit | \`${RELEASE_COMMIT:-n/a}\` |
          | Version | v${APK_VERSION:-n/a} (versionCode ${VERSION_CODE:-n/a}) |
          | APK | \`${APK:-n/a}\` (${APK_SIZE:-n/a} bytes) |
          | Build type | ${BUILD_TYPE} |
          EOF
