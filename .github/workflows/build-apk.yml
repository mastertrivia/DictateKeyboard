name: Build APK

# Builds the real Dictate Keyboard Android app on GitHub's cloud runners and
# publishes the resulting APK as a workflow artifact (optionally as a Release).
#
# IMPORTANT - when does this build?
# -----------------------------------------------------------------------------
# This workflow must ONLY run for official UPSTREAM RELEASE TAGS
# (DevEmperor/DictateKeyboard tags like v6.1.2, v6.1.3, ...). It is deliberately
# NOT wired to pushes to this fork's main branch, and the "Sync upstream"
# workflow does NOT dispatch it either. Ordinary upstream commits are synced by
# "Sync upstream" without producing any APK.
#
# How the correct source is chosen:
#   1. The workflow checks out the EXACT commit the upstream release tag points
#      to (not this fork's moving main branch), so an APK labelled "6.1.2" is
#      really built from upstream's v6.1.2 source.
#   2. Two small fork-only tweaks are then re-applied on top of that pristine
#      tag so the code still builds on GitHub's ubuntu-latest runners. Those
#      tweaks live as plain patches in .github/ci-patches/ and are applied with
#      `git apply --3way` (see the comments at the top of each patch):
#        - gradle.properties  -> CI-safe Gradle/Kotlin daemon heaps
#        - app/build.gradle.kts -> the :app lint disable mirroring :wear
#   3. Because we build the pristine upstream tag, projectVersionName and
#      projectVersionCode stay exactly what upstream declared for the release.
#
# Trigger model:
#   - workflow_dispatch with an upstream_release_tag  -> build that exact tag.
#   - workflow_dispatch without a tag, or the schedule -> auto-detect the
#     oldest upstream release tag that is newer than the last processed one
#     (floor v6.1.1) and not yet recorded in the processed list, then build it.
#   - The processed list is kept on the ci/release-history branch in
#     .github/upstream-app-releases-processed.txt so the same tag is never
#     built twice; pass force=true to rebuild one anyway.
#   - The 4-hourly schedule is the safety net that catches a release whose
#     tag event the fork missed for any reason.
#
# Signing:
#   The APK signature must be stable between builds, or Android refuses to
#   install a newer build over an older one ("App not installed"). The signing
#   key is generated ONCE and reused from the Actions cache
#   (dictate-ci-signing-keystore-v1). The daily "Sync upstream" workflow keeps
#   that cache alive so GitHub never evicts it. If the cache is ever lost the
#   build FAILS loudly instead of silently rotating the key; the keystore can
#   then be restored from the secret override (KEYSTORE_BASE64 + KEYSTORE_
#   PASSWORD/KEY_ALIAS/KEY_PASSWORD) or a fresh key may be bootstrapped by
#   setting allow_new_key_if_missing=true (deliberate key rotation only).

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Upstream repository (owner/name) to build from'
        required: false
        default: 'DevEmperor/DictateKeyboard'
        type: string
      upstream_release_tag:
        description: 'Upstream release tag to build (e.g. v6.1.2). Empty = auto-detect the oldest unprocessed upstream release tag newer than v6.1.1'
        required: false
        default: ''
        type: string
      build_type:
        description: 'APK variant to build (release, debug or beta)'
        type: choice
        required: true
        default: 'release'
        options:
          - 'release'
          - 'debug'
          - 'beta'
      force:
        description: 'Rebuild even if this upstream tag was already processed'
        type: boolean
        required: false
        default: false
      create_fork_release:
        description: 'Also publish a fork GitHub Release (dictate-v<version>-ci) with the APK. Off by default: builds only upload an artifact.'
        type: boolean
        required: false
        default: false
      allow_new_key_if_missing:
        description: 'Bootstrap only: generate a fresh signing keystore if none exists (this ROTATES the signing key - only use deliberately)'
        type: boolean
        required: false
        default: false

  schedule:
    # Runs every 4 hours to pick up new upstream release tags (fallback if the
    # tag event was ever missed). No-ops quickly when there is nothing new.
    - cron: '23 0,4,8,12,16,20 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  # All runs of this workflow serialize so the processed-release list on
  # ci/release-history can never be updated by two runs at once.
  group: build-apk
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}
      UPSTREAM_REPO: ${{ github.event.inputs.upstream_repo || 'DevEmperor/DictateKeyboard' }}
      # Every upstream release tag at or below this version is considered
      # already handled historically (fork GitHub Releases dictate-v6.0.0-ci
      # and dictate-v6.1.1-ci cover v6.0.0 and v6.1.1). Auto-detection only
      # considers tags STRICTLY newer than this floor.
      FLOOR_VERSION: '6.1.1'
      MARKER_BRANCH: ci/release-history
      MARKER_FILE: .github/upstream-app-releases-processed.txt
      # Expected signing certificate (SHA-256) of the CI keystore in use.
      EXPECTED_CERT_SHA256: '38eb6683c0f9fde03882c176a372d5a86dee860183c785cec4b7a517f3db1520'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Restore the shared CI signing keystore so this run counts as an access
      # and GitHub never evicts it. Populates it on a cold cache too. Runs on
      # every invocation (including quick no-op scans) to keep the key alive.
      - name: Restore CI signing keystore
        uses: actions/cache@v4
        with:
          path: ~/.ci-signing
          key: dictate-ci-signing-keystore-v1

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/tools.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Determine upstream release to build
        id: determine
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.upstream_release_tag }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail

          UPSTREAM_URL="https://github.com/${UPSTREAM_REPO}.git"

          # Remember what upstream tags we already processed (ci/release-history
          # branch, .github/upstream-app-releases-processed.txt).
          PROCESSED=""
          if git fetch -q origin "${MARKER_BRANCH}:refs/remotes/origin/${MARKER_BRANCH}" 2>/dev/null; then
            PROCESSED=$(git show "refs/remotes/origin/${MARKER_BRANCH}:${MARKER_FILE}" 2>/dev/null \
              | sed -n 's/^\(v[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)[[:space:]].*/\1/p' || true)
          fi

          newer_than() { # $1 floor, $2 candidate -> true if $2 > $1
            [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n1)" = "$2" ]
          }

          RELEASE_TAG=""
          MODE="auto"

          if [ -n "$INPUT_TAG" ]; then
            MODE="manual"
            RELEASE_TAG="$INPUT_TAG"
          else
            ALL_TAGS=$(git ls-remote --tags "$UPSTREAM_URL" \
              | sed -n 's#.*refs/tags/\(v[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$#\1#p' \
              | sort -V)
            for t in $ALL_TAGS; do
              ver="${t#v}"
              newer_than "$FLOOR_VERSION" "$ver" || continue
              if [ -n "$PROCESSED" ] && printf '%s\n' "$PROCESSED" | grep -qx "$t"; then
                continue
              fi
              RELEASE_TAG="$t"
              break
            done
          fi

          if [ -z "$RELEASE_TAG" ]; then
            echo "No unprocessed upstream release tag newer than v${FLOOR_VERSION} found; nothing to build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "skip_reason=no-new-release" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Unsupported tag format: $RELEASE_TAG (expected vX.Y.Z)"; exit 1 ;;
          esac

          # Confirm the tag really exists upstream.
          if ! git ls-remote --exit-code --tags "$UPSTREAM_URL" "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Upstream tag $RELEASE_TAG not found on ${UPSTREAM_REPO}"
            exit 1
          fi

          # Deduplicate: skip a tag we already processed (unless force).
          if [ -n "$PROCESSED" ] && printf '%s\n' "$PROCESSED" | grep -qx "$RELEASE_TAG" \
             && [ "$FORCE" != "true" ]; then
            echo "Upstream tag ${RELEASE_TAG} was already processed; skipping (set force=true to rebuild)."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "skip_reason=already-processed" >> "$GITHUB_OUTPUT"
            echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
            echo "tag_version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "tag_version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "Selected upstream release: ${RELEASE_TAG} (mode: ${MODE})"

      # The fork-only patches live on main; copy them aside BEFORE the working
      # tree is switched to the pristine upstream release commit below.
      - name: Stash fork-only CI patches
        if: steps.determine.outputs.should_build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ci-patches
          if ls .github/ci-patches/*.patch >/dev/null 2>&1; then
            cp .github/ci-patches/*.patch /tmp/ci-patches/
            echo "Stashed fork-only CI patches:"
            ls -1 /tmp/ci-patches
          else
            echo "::warning::No fork-only CI patches found in .github/ci-patches/; building the tag exactly as upstream released it."
          fi

      - name: Check out exact upstream release commit and apply fork patches
        id: checkout_release
        if: steps.determine.outputs.should_build == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.determine.outputs.release_tag }}
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null \
            || git remote set-url upstream "https://github.com/${UPSTREAM_REPO}.git"

          # Full (not shallow) fetch of the tag so the working history around the
          # release commit is intact (some buildType suffixes query git history).
          git fetch -q "upstream" "refs/tags/${RELEASE_TAG}:refs/tags/upstream/${RELEASE_TAG}"
          RELEASE_COMMIT=$(git rev-parse "refs/tags/upstream/${RELEASE_TAG}^{commit}")
          echo "release_commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"

          echo "Checking out upstream ${RELEASE_TAG} at commit ${RELEASE_COMMIT} ..."
          git checkout -q --detach "$RELEASE_COMMIT"

          if ls /tmp/ci-patches/*.patch >/dev/null 2>&1; then
            for p in /tmp/ci-patches/*.patch; do
              if ! git apply --3way --whitespace=nowarn "$p"; then
                echo "::error::Fork-only CI patch $p no longer applies cleanly to upstream ${RELEASE_TAG}."
                echo "The fork's CI tweaks (gradle.properties daemon heaps, :app lint disable) must be refreshed against this upstream release."
                exit 1
              fi
            done
            echo "Applied fork-only CI patches on top of ${RELEASE_TAG}."
          fi

          # Surface the version the tag itself declares.
          VN=$(sed -n 's/^projectVersionName=//p' gradle.properties)
          VC=$(sed -n 's/^projectVersionCode=//p' gradle.properties)
          echo "VERSION_NAME=$VN" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VC" >> "$GITHUB_ENV"
          echo "Working tree now at ${RELEASE_TAG} (${RELEASE_COMMIT}), declaring versionName=${VN} versionCode=${VC}"

      - name: Set up Android SDK components
        if: steps.determine.outputs.should_build == 'true'
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found in \$ANDROID_HOME or on PATH"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
          "$SDKMANAGER" --list_installed

      - name: Fetch sherpa-onnx native libraries
        if: steps.determine.outputs.should_build == 'true'
        shell: bash
        run: bash tools/fetch-sherpa-onnx.sh

      # The APK signature must be stable between builds, or Android refuses to
      # install a newer build over an older one ("App not installed"). The key
      # lives in the Actions cache and is kept alive by the daily Sync workflow.
      # If the keystore is missing this step FAILS instead of silently rotating
      # the key. Restore it either via the KEYSTORE_BASE64 secret override or by
      # running the "Backup signing keystore" workflow after setting secrets.
      - name: Configure release signing
        if: steps.determine.outputs.should_build == 'true'
        shell: bash
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          ALLOW_NEW_KEY: ${{ github.event.inputs.allow_new_key_if_missing }}
        run: |
          KS_PASS="${KS_PASS:-dictate-ci-2026}"
          KS_ALIAS="${KS_ALIAS:-dictate}"
          KS_KEY_PASS="${KS_KEY_PASS:-$KS_PASS}"
          KEYSTORE_DIR="$HOME/.ci-signing"
          KEYSTORE="$KEYSTORE_DIR/ci-release.jks"
          mkdir -p "$KEYSTORE_DIR"

          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE"
            echo "Restored signing keystore from the KEYSTORE_BASE64 secret."
          elif [ -f "$KEYSTORE" ]; then
            echo "Using the cached CI signing keystore."
          elif [ "$ALLOW_NEW_KEY" = "true" ]; then
            echo "::warning::No signing keystore found - generating a NEW one. This ROTATES the signing key and existing installs will not accept updates signed with it."
            keytool -genkey -v -keystore "$KEYSTORE" -alias "$KS_ALIAS" \
              -keyalg RSA -keysize 4096 -validity 10000 -storetype JKS \
              -storepass "$KS_PASS" -keypass "$KS_KEY_PASS" \
              -dname "CN=Dictate Keyboard CI,O=Dictate CI,C=US"
          else
            echo "::error::No CI signing keystore is available (cache miss, no KEYSTORE_BASE64 secret)."
            echo "To keep the stable signing identity, set the KEYSTORE_BASE64 (and KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD) secrets, or run the 'Backup signing keystore' workflow, then re-run this build."
            echo "Do NOT set allow_new_key_if_missing=true unless you intentionally want to rotate the signing key."
            exit 1
          fi

          cat > keystore.properties <<EOF
          storeFile=$KEYSTORE
          storePassword=$KS_PASS
          keyAlias=$KS_ALIAS
          keyPassword=$KS_KEY_PASS
          EOF
          echo "Wrote keystore.properties for release signing."

      - name: Build APK
        if: steps.determine.outputs.should_build == 'true'
        shell: bash
        run: |
          case "$BUILD_TYPE" in
            debug) TASK="assembleDebug" ;;
            beta)  TASK="assembleBeta" ;;
            *)     TASK="assembleRelease" ;;
          esac
          ./gradlew "$TASK" --stacktrace --no-daemon

      - name: Verify APK
        id: verify
        if: steps.determine.outputs.should_build == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.determine.outputs.release_tag }}
          TAG_VERSION: ${{ steps.determine.outputs.tag_version }}
        run: |
          APK_DIR="app/build/outputs/apk/$BUILD_TYPE"
          ls -la "$APK_DIR"
          APK="$(ls "$APK_DIR"/*.apk | head -1)"
          if [ -z "$APK" ] || [ ! -s "$APK" ]; then
            echo "::error::No APK produced in $APK_DIR"
            exit 1
          fi
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "APK_SIZE=$(stat -c %s "$APK")" >> "$GITHUB_ENV"
          echo "APK_VERSION=$(jq -r '.elements[0].versionName' "$APK_DIR/output-metadata.json")" >> "$GITHUB_ENV"

          # The upstream tag being built must be the version actually shipped.
          if [ "$BUILD_TYPE" = "release" ] && [ "$TAG_VERSION" != "$(jq -r '.elements[0].versionName' "$APK_DIR/output-metadata.json")" ]; then
            echo "::error::Version mismatch: building upstream ${RELEASE_TAG} but the APK reports versionName $(jq -r '.elements[0].versionName' "$APK_DIR/output-metadata.json"). Expected ${TAG_VERSION}."
            exit 1
          fi

          # Signing checks apply to release/beta (debug APKs use the Android
          # debug key). The APK must be signed by the keystore we configured,
          # and (when no secret override is in play) that keystore must still be
          # the stable CI key - any deviation fails the build loudly.
          if [ "$BUILD_TYPE" != "debug" ]; then
            APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
            [ -n "$APKSIGNER" ] || { echo "::error::apksigner not found"; exit 1; }
            echo "apksigner: $APKSIGNER"
            "$APKSIGNER" verify --print-certs "$APK"

            APK_SHA=$("$APKSIGNER" verify --print-certs "$APK" \
              | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
              | tr 'A-F' 'a-f')
            [ -n "$APK_SHA" ] || { echo "::error::Could not read APK signer certificate"; exit 1; }

            KS_PASS=$(sed -n 's/^storePassword=//p' keystore.properties)
            KS_ALIAS=$(sed -n 's/^keyAlias=//p' keystore.properties)
            KEYSTORE=$(sed -n 's/^storeFile=//p' keystore.properties)
            KS_SHA=$(keytool -list -v -keystore "$KEYSTORE" -storepass "$KS_PASS" -alias "$KS_ALIAS" 2>/dev/null \
              | sed -n 's/^[[:space:]]*SHA256: //p' \
              | tr -d ' :' | tr 'A-F' 'a-f')

            echo "APK signer   SHA-256: $APK_SHA"
            echo "Keystore     SHA-256: $KS_SHA"

            if [ "$APK_SHA" != "$KS_SHA" ]; then
              echo "::error::APK was not signed by the configured CI keystore (${APK_SHA} != ${KS_SHA})."
              exit 1
            fi

            if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ] && [ "$KS_SHA" != "$EXPECTED_CERT_SHA256" ]; then
              echo "::error::Signing keystore changed unexpectedly (${KS_SHA} != expected ${EXPECTED_CERT_SHA256})."
              echo "The cache may have rotated the key. Restore the intended keystore and re-run; never silently accept a new key."
              exit 1
            fi
            echo "Signature verified: APK is signed by the stable CI keystore."
          fi

      - name: Upload APK artifact
        if: steps.determine.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dictate-keyboard-${{ env.APK_VERSION }}-${{ env.BUILD_TYPE }}
          path: app/build/outputs/apk/${{ env.BUILD_TYPE }}/*.apk
          if-no-files-found: error
          retention-days: 30

      # Opt-in only: by default builds upload an artifact and nothing else.
      - name: Create fork GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.create_fork_release == true && steps.determine.outputs.should_build == 'true' && env.BUILD_TYPE == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.determine.outputs.release_tag }}
          RELEASE_COMMIT: ${{ steps.checkout_release.outputs.release_commit }}
        run: |
          RELEASE_NAME="dictate-v${APK_VERSION}-ci"
          if gh release view "$RELEASE_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::warning::Fork release ${RELEASE_NAME} already exists; skipping creation."
            exit 0
          fi
          gh release create "$RELEASE_NAME" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "${RELEASE_COMMIT:-${GITHUB_SHA}}" \
            --title "Dictate Keyboard v${APK_VERSION} (CI build from upstream ${RELEASE_TAG})" \
            --notes "Built from the exact upstream release tag \`${RELEASE_TAG}\` (commit \`${RELEASE_COMMIT:-${GITHUB_SHA}}\`), with only the fork's CI build patches applied. Artifact: \`${APK}\`, size: ${APK_SIZE} bytes, versionCode: ${VERSION_CODE}."
          echo "Created fork release ${RELEASE_NAME}."

      # Record this upstream release tag as processed so it is never built
      # twice. State is stored on the ci/release-history branch. Appends are
      # performed from the freshest remote base each attempt, so concurrent
      # runs merge cleanly (each appends its own line after fast-forwarding).
      - name: Mark upstream release as processed
        if: steps.determine.outputs.should_build == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.determine.outputs.release_tag }}
          RELEASE_COMMIT: ${{ steps.checkout_release.outputs.release_commit }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          PUSHED=0
          for attempt in 1 2 3 4 5; do
            # Start from the freshest remote tip of the marker branch.
            if git fetch -q origin "${MARKER_BRANCH}:refs/remotes/origin/${MARKER_BRANCH}" 2>/dev/null \
               && git rev-parse -q --verify "refs/remotes/origin/${MARKER_BRANCH}" >/dev/null; then
              git checkout -q -B "${MARKER_BRANCH}" "refs/remotes/origin/${MARKER_BRANCH}"
            else
              git checkout -q --orphan "${MARKER_BRANCH}"
              git rm -rfq --cached . 2>/dev/null || true
            fi

            mkdir -p ".github"
            TMP=$(mktemp)
            : > "$TMP"
            if [ -f "${MARKER_FILE}" ]; then
              grep -v "^${RELEASE_TAG}[[:space:]]" "${MARKER_FILE}" > "$TMP" || true
            fi
            echo "${RELEASE_TAG} ${RELEASE_COMMIT:-unknown} $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$TMP"
            sort -V -u -o "$TMP" "$TMP"
            mv "$TMP" "${MARKER_FILE}"

            git add "${MARKER_FILE}"
            if git diff --cached --quiet; then
              echo "Marker already up to date."
            else
              git commit -q -m "ci: mark upstream ${RELEASE_TAG} as processed"
            fi

            if git push -q origin "${MARKER_BRANCH}"; then
              echo "Pushed ${RELEASE_TAG} to ${MARKER_BRANCH} (attempt ${attempt})."
              PUSHED=1
              break
            fi
            echo "Marker push failed (attempt ${attempt}); fetching newer base and retrying ..."
          done

          if [ "$PUSHED" -ne 1 ]; then
            echo "::error::Could not push processed-release marker to ${MARKER_BRANCH} after retries."
            exit 1
          fi

      - name: Build summary
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.determine.outputs.release_tag }}
          TAG_VERSION: ${{ steps.determine.outputs.tag_version }}
          MODE: ${{ steps.determine.outputs.mode }}
          SKIP_REASON: ${{ steps.determine.outputs.skip_reason }}
          SHOULD_BUILD: ${{ steps.determine.outputs.should_build }}
          RELEASE_COMMIT: ${{ steps.checkout_release.outputs.release_commit }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Build outcome

          | Item | Value |
          |---|---|
          EOF
          if [ "$SHOULD_BUILD" = "true" ]; then
            printf '| Upstream release | %s |\n' "${RELEASE_TAG}" >> "$GITHUB_STEP_SUMMARY"
            printf '| Source commit | `%s` |\n' "${RELEASE_COMMIT}" >> "$GITHUB_STEP_SUMMARY"
            printf '| Version | v%s (versionCode %s) |\n' "${APK_VERSION}" "${VERSION_CODE}" >> "$GITHUB_STEP_SUMMARY"
            printf '| APK | `%s` (%s bytes) |\n' "${APK}" "${APK_SIZE}" >> "$GITHUB_STEP_SUMMARY"
            printf '| Build type | %s |\n' "${BUILD_TYPE}" >> "$GITHUB_STEP_SUMMARY"
            echo "Built upstream ${RELEASE_TAG} (${RELEASE_COMMIT}) -> ${APK} v${APK_VERSION}"
          else
            printf '| Outcome | skipped (%s) |\n' "${SKIP_REASON:-unknown}" >> "$GITHUB_STEP_SUMMARY"
            echo "Nothing built (${SKIP_REASON:-unknown})."
          fi
