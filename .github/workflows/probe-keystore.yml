name: Probe signing keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore CI signing keystore
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.ci-signing
          key: dictate-ci-signing-keystore-v1
      - name: Print keystore certificate
        shell: bash
        run: |
          echo "cache-hit=${{ steps.cache.outputs.cache-hit }}"
          ls -la "$HOME/.ci-signing/" 2>&1
          keytool -list -v -keystore "$HOME/.ci-signing/ci-release.jks" \
            -storepass dictate-ci-2026 -alias dictate 2>&1 | \
            grep -iE "Alias|SHA1|SHA256|Entry" || echo "keytool failed or file missing"
